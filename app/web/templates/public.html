<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NexTunnel — سرور</title>
<link rel="icon" type="image/svg+xml" href="/static/img/logo.svg">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="card auth-card fade">
    <div class="auth-logo"><img src="/static/img/logo.svg" alt="NexTunnel"></div>
    <h1 style="text-align:center;font-size:20px">NexTunnel</h1>
    <p class="muted center" style="margin-bottom:18px">درگاه تونل امنِ چندپروتکلی</p>
    <div class="center">
      <span class="badge on">VLESS+WS</span>
      <span class="badge on">XHTTP Packet-Up</span>
      <span class="badge on">XHTTP Stream-Up</span>
    </div>
    <div class="field mt-2"><label>Plain proxy (HTTP)</label>
      <div class="code">${host}:${port}</div>
    </div>
    <p class="muted center" style="margin-top:14px">برای اتصال، از کانفیگ اختصاصی یا لینک اشتراک گروه خود استفاده کنید.</p>
    <p class="muted center"><a href="/">ورود به پنل مدیریت</a></p>
  </div>
</div>
</body>
</html>
